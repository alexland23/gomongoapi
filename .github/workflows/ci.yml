name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: go vet
        run: make vet

      - name: go test
        run: make test

  example-build:
    name: example module build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: go build (examples/simpleDemo)
        working-directory: examples/simpleDemo
        run: go build ./...
